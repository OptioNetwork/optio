syntax = "proto3";
package optio.licenses;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "optio/licenses/params.proto";
import "optio/licenses/license_type.proto";
import "optio/licenses/license.proto";

option go_package = "github.com/OptioNetwork/optio/x/licenses/types";

// GenesisState defines the licenses module's genesis state.
message GenesisState {
  Params               params        = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated LicenseType license_types = 2 [(gogoproto.nullable) = false];
  repeated License     licenses      = 3 [(gogoproto.nullable) = false];
  repeated AdminKey    admin_keys    = 4 [(gogoproto.nullable) = false];
}
